<script>
/* ============================================================
   PWA: Manifest + Service Worker
   ============================================================ */
const manifest = {
  name: 'BookShelf', short_name: 'Books', start_url: '.', display: 'standalone',
  background_color: '#ffffff', theme_color: '#7c3aed',
  icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%237c3aed'/%3E%3Ctext x='256' y='350' font-size='280' text-anchor='middle'%3E📚%3C/text%3E%3C/svg%3E", sizes: '512x512', type: 'image/svg+xml' }]
};
const ml = document.createElement('link');
ml.rel = 'manifest'; ml.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(manifest));
document.head.appendChild(ml);

if ('serviceWorker' in navigator) {
  const sw = `self.addEventListener('install',e=>self.skipWaiting());
    self.addEventListener('activate',e=>self.clients.claim());
    self.addEventListener('fetch',e=>{e.respondWith(caches.open('books-v1').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(resp=>{c.put(e.request,resp.clone());return resp;}).catch(()=>new Response('Offline')))));});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], { type: 'application/javascript' }))).catch(() => {});
}

/* ============================================================
   IndexedDB setup
   ============================================================ */
let db;
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open('bookshelf', 1);
  r.onupgradeneeded = e => {
    const d = e.target.result;
    ['books', 'ratings', 'favorites', 'reading', 'settings'].forEach(s => {
      if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
    });
  };
  r.onsuccess = e => { db = e.target.result; res(); };
  r.onerror = e => rej(r.error);
});

const dbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbTx  = t => new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
const DB = {
  getAll: async s => { const t = db.transaction(s, 'readonly'), r = t.objectStore(s).getAll(); const v = await dbReq(r); await dbTx(t); return v; },
  get:    async (s, id) => { const t = db.transaction(s, 'readonly'), r = t.objectStore(s).get(id); const v = await dbReq(r); await dbTx(t); return v; },
  put:    async (s, d) => { const t = db.transaction(s, 'readwrite'), r = t.objectStore(s).put(d); const v = await dbReq(r); await dbTx(t); return v; },
  delete: async (s, id) => { const t = db.transaction(s, 'readwrite'), r = t.objectStore(s).delete(id); await dbReq(r); await dbTx(t); },
};

/* ============================================================
   Seed data: cover SVGs as Blobs
   ============================================================ */
const coverBlob = (c1, c2, title, author) => new Blob([`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
  </linearGradient></defs>
  <rect width="300" height="450" fill="url(#g)"/>
  <rect x="20" y="20" width="260" height="410" fill="none" stroke="white" stroke-opacity="0.3" stroke-width="2"/>
  <text x="150" y="200" font-family="serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">${title}</text>
  <text x="150" y="350" font-family="sans-serif" font-size="16" fill="white" fill-opacity="0.85" text-anchor="middle">${author}</text>
</svg>`], { type: 'image/svg+xml' });

const GENRES = ['Fiction', 'Mystery', 'Sci-Fi', 'Romance', 'Fantasy', 'Non-Fiction'];

const SEED = [
  { id: 'b1', title: 'The Silent Echo',    author: 'Ava Monroe',  genre: 'Mystery',    description: 'A detective uncovers a decades-old secret hidden in a quiet coastal town.', cover: coverBlob('#1e3a8a', '#3b82f6', 'The Silent Echo', 'Ava Monroe') },
  { id: 'b2', title: 'Starbound',          author: 'Leo Chen',    genre: 'Sci-Fi',     description: 'A crew of explorers journeys beyond the edge of known space.', cover: coverBlob('#4c1d95', '#a855f7', 'Starbound', 'Leo Chen') },
  { id: 'b3', title: 'Autumn in Paris',    author: 'Sophie Laurent', genre: 'Romance', description: 'Two strangers meet in a Parisian bookshop and change each other forever.', cover: coverBlob('#be185d', '#f472b6', 'Autumn in Paris', 'Sophie L.') },
  { id: 'b4', title: 'The Last Kingdom',   author: 'Marcus Vale', genre: 'Fantasy',    description: 'A fallen prince must reclaim his throne from the shadows.', cover: coverBlob('#065f46', '#10b981', 'The Last Kingdom', 'Marcus Vale') },
  { id: 'b5', title: 'Thinking Forward',   author: 'Dr. Rina Patel', genre: 'Non-Fiction', description: 'A practical guide to building better habits and sharper thinking.', cover: coverBlob('#9a3412', '#f59e0b', 'Thinking Forward', 'Dr. R. Patel') },
  { id: 'b6', title: 'Midnight Letters',   author: 'Elena Brooks', genre: 'Fiction',   description: 'A collection of letters that reveal a family\'s hidden past.', cover: coverBlob('#7c2d12', '#dc2626', 'Midnight Letters', 'Elena Brooks') },
  { id: 'b7', title: 'Code of the Wild',   author: 'Jin Park',    genre: 'Sci-Fi',     description: 'An AI awakens in a post-human world and must decide its own fate.', cover: coverBlob('#0e7490', '#06b6d4', 'Code of the Wild', 'Jin Park') },
  { id: 'b8', title: 'Garden of Glass',    author: 'Nora Quinn',  genre: 'Fantasy',    description: 'A young cartographer discovers a map to a realm made of mirrors.', cover: coverBlob('#5b21b6', '#c084fc', 'Garden of Glass', 'Nora Quinn') }
];

async function seedIfEmpty() {
  if ((await DB.getAll('books')).length === 0) {
    for (const b of SEED) await DB.put('books', b);
  }
}

/* ============================================================
   Object URL tracking
   ============================================================ */
const objectUrls = new Map();
const trackUrl = (key, blob) => { const u = URL.createObjectURL(blob); objectUrls.set(key, u); return u; };
const revokeUrls = () => { objectUrls.forEach(u => URL.revokeObjectURL(u)); objectUrls.clear(); };

/* ============================================================
   Router
   ============================================================ */
const parseHash = () => {
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  return { path: parts[0] || '', param: parts[1] };
};

async function render() {
  revokeUrls();
  const { path, param } = parseHash();
  const app = document.getElementById('app');
  try {
    if (path === 'book')      await viewBook(param);
    else if (path === 'browse')    await viewBrowse();
    else if (path === 'favorites') await viewFavorites();
    else if (path === 'reading')   await viewReading();
    else if (path === 'add')       await viewAdd();
    else                           await viewHome();
  } catch (e) { app.innerHTML = `<div class="alert alert-error">${e.message}</div>`; }
  lucide.createIcons();
}
window.addEventListener('hashchange', render);

/* ============================================================
   Helpers
   ============================================================ */
async function getAvgRating(bookId) {
  const all = await DB.getAll('ratings');
  const mine = all.filter(r => r.bookId === bookId);
  if (mine.length === 0) return { avg: 0, count: 0 };
  const sum = mine.reduce((s, r) => s + r.stars, 0);
  return { avg: sum / mine.length, count: mine.length };
}

async function isFavorite(id) { return !!(await DB.get('favorites', id)); }
async function getReadingStatus(id) { const r = await DB.get('reading', id); return r ? r.status : null; }

function starsHtml(rating, interactive = false, bookId = null) {
  const full = Math.round(rating);
  let html = '<div class="rating rating-sm rating-half">';
  for (let i = 1; i <= 5; i++) {
    const checked = i <= full ? 'checked' : '';
    if (interactive) {
      html += `<input type="radio" name="rating-${bookId}" class="mask mask-half-2 bg-primary" value="${i}" ${checked} onclick="rateBook('${bookId}', ${i})">`;
    } else {
      html += `<input type="radio" class="mask mask-half-2 bg-primary" ${checked} disabled>`;
    }
  }
  html += '</div>';
  return html;
}

function bookCard(b, url) {
  return `
    <div class="card bg-base-100 shadow hover:shadow-xl transition cursor-pointer" onclick="location.hash='#/book/${b.id}'">
      <figure class="bg-base-200"><img src="${url}" alt="${b.title}" class="cover w-full"></figure>
      <div class="card-body p-3">
        <h3 class="font-bold text-sm line-clamp-1">${b.title}</h3>
        <p class="text-xs opacity-60 line-clamp-1">${b.author}</p>
        <div class="flex justify-between items-center mt-1">
          <span class="badge badge-soft badge-primary badge-xs">${b.genre}</span>
        </div>
      </div>
    </div>`;
}

/* ============================================================
   Views
   ============================================================ */
async function viewHome() {
  const books = await DB.getAll('books');
  // Recommendations: top genres from user's ratings
  const ratings = await DB.getAll('ratings');
  const genreScore = {};
  for (const r of ratings) {
    const b = books.find(x => x.id === r.bookId);
    if (!b) continue;
    genreScore[b.genre] = (genreScore[b.genre] || 0) + r.stars;
  }
  const topGenres = Object.entries(genreScore).sort((a, b) => b[1] - a[1]).slice(0, 2).map(e => e[0]);
  const ratedIds = new Set(ratings.map(r => r.bookId));

  let recs = [];
  if (topGenres.length > 0) {
    recs = books.filter(b => topGenres.includes(b.genre) && !ratedIds.has(b.id));
  }
  if (recs.length === 0) recs = books.slice(0, 4);
  recs = recs.slice(0, 4);

  const topRated = (await Promise.all(books.map(async b => ({ ...b, avg: (await getAvgRating(b.id)).avg }))))
    .sort((a, b) => b.avg - a.avg).slice(0, 4);

  document.getElementById('app').innerHTML = `
    <div class="fade-in">
      <div class="hero bg-gradient-to-br from-primary via-secondary to-accent text-primary-content rounded-2xl mb-8 shadow-xl">
        <div class="hero-content py-12 text-center">
          <div>
            <h1 class="text-4xl md:text-5xl font-bold">Find your next favorite book</h1>
            <p class="py-4 md:text-lg opacity-90">Rate, review, and discover books tailored to your taste</p>
            <a href="#/browse" class="btn btn-secondary"><i data-lucide="search"></i> Browse Library</a>
          </div>
        </div>
      </div>

      <h2 class="text-2xl font-bold mb-4 flex items-center gap-2"><i data-lucide="sparkles"></i> Recommended for you</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
        ${recs.map(b => bookCard(b, trackUrl(b.id, b.cover))).join('') || '<p class="col-span-full opacity-60">Rate some books to get personalized recommendations!</p>'}
      </div>

      <h2 class="text-2xl font-bold mb-4 flex items-center gap-2"><i data-lucide="star"></i> Top Rated</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        ${topRated.map(b => bookCard(b, trackUrl('top-' + b.id, b.cover))).join('')}
      </div>
    </div>`;
}

async function viewBrowse() {
  const books = await DB.getAll('books');
  const app = document.getElementById('app');
  const renderList = (filtered) => {
    const html = `
      <div class="fade-in">
        <h2 class="text-3xl font-bold mb-4">Browse Library</h2>
        <div class="flex flex-col md:flex-row gap-3 mb-6">
          <label class="input input-bordered flex items-center gap-2 flex-1">
            <i data-lucide="search" class="opacity-60"></i>
            <input type="text" id="searchInput" placeholder="Search title or author..." class="grow" value="${app.dataset.search || ''}">
          </label>
          <select id="genreSelect" class="select select-bordered">
            <option value="">All Genres</option>
            ${GENRES.map(g => `<option value="${g}" ${app.dataset.genre === g ? 'selected' : ''}>${g}</option>`).join('')}
          </select>
        </div>
        <div id="bookGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
          ${filtered.length ? filtered.map(b => bookCard(b, trackUrl(b.id, b.cover))).join('') : '<p class="col-span-full opacity-60 text-center py-10">No books match your filters.</p>'}
        </div>
      </div>`;
    app.innerHTML = html;
    lucide.createIcons();
    document.getElementById('searchInput').addEventListener('input', onFilter);
    document.getElementById('genreSelect').addEventListener('change', onFilter);
  };

  const onFilter = () => {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const g = document.getElementById('genreSelect').value;
    app.dataset.search = q; app.dataset.genre = g;
    revokeUrls();
    const filtered = books.filter(b =>
      (b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)) &&
      (!g || b.genre === g)
    );
    document.getElementById('bookGrid').innerHTML = filtered.length
      ? filtered.map(b => bookCard(b, trackUrl(b.id, b.cover))).join('')
      : '<p class="col-span-full opacity-60 text-center py-10">No books match your filters.</p>';
  };
  renderList(books);
}

async function viewBook(id) {
  const b = await DB.get('books', id);
  if (!b) throw new Error('Book not found');
  const url = trackUrl(id, b.cover);
  const { avg, count } = await getAvgRating(id);
  const fav = await isFavorite(id);
  const readStatus = await getReadingStatus(id);
  const myRating = await DB.get('ratings', id);
  const allRatings = (await DB.getAll('ratings')).filter(r => r.bookId === id);

  document.getElementById('app').innerHTML = `
    <div class="fade-in">
      <button class="btn btn-ghost mb-4" onclick="history.back()"><i data-lucide="arrow-left"></i> Back</button>
      <div class="card lg:card-side bg-base-100 shadow-xl">
        <figure class="lg:w-1/3 bg-base-200"><img src="${url}" alt="${b.title}" class="w-full h-full object-cover"></figure>
        <div class="card-body">
          <span class="badge badge-primary">${b.genre}</span>
          <h2 class="card-title text-3xl">${b.title}</h2>
          <p class="text-lg opacity-70">by ${b.author}</p>
          <p class="mt-2">${b.description}</p>

          <div class="divider"></div>

          <div class="flex flex-wrap items-center gap-4">
            <div>
              <div class="text-sm opacity-70 mb-1">Community rating</div>
              <div class="flex items-center gap-2">
                ${starsHtml(avg)}
                <span class="font-bold">${avg.toFixed(1)}</span>
                <span class="text-sm opacity-60">(${count})</span>
              </div>
            </div>
          </div>

          <div class="divider"></div>

          <h3 class="font-bold">Your rating</h3>
          <div class="flex items-center gap-3">
            ${starsHtml(myRating ? myRating.stars : 0, true, id)}
            ${myRating ? `<button class="btn btn-ghost btn-xs" onclick="clearRating('${id}')">Clear</button>` : ''}
          </div>

          <label class="form-control mt-3">
            <span class="label-text mb-1">Your review</span>
            <textarea id="reviewInput" class="textarea textarea-bordered" placeholder="Share your thoughts...">${myRating ? myRating.review || '' : ''}</textarea>
          </label>
          <button class="btn btn-primary btn-sm mt-2 self-start" onclick="saveReview('${id}')"><i data-lucide="save"></i> Save Review</button>

          <div class="divider"></div>

          <div class="flex flex-wrap gap-2">
            <button class="btn ${fav ? 'btn-error' : 'btn-outline'}" onclick="toggleFav('${id}')">
              <i data-lucide="heart"></i> ${fav ? 'Favorited' : 'Favorite'}
            </button>
            <div class="dropdown">
              <div tabindex="0" role="button" class="btn ${readStatus ? 'btn-success' : 'btn-outline'}">
                <i data-lucide="book-open"></i> ${readStatus ? readStatus : 'Reading List'}
              </div>
              <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-44 p-2 shadow">
                <li><a onclick="setReading('${id}', 'to-read')">📌 To Read</a></li>
                <li><a onclick="setReading('${id}', 'reading')">📖 Reading</a></li>
                <li><a onclick="setReading('${id}', 'finished')">✅ Finished</a></li>
                ${readStatus ? `<li><a onclick="setReading('${id}', null)">✖ Remove</a></li>` : ''}
              </ul>
            </div>
          </div>

          ${allRatings.length ? `
            <div class="divider"></div>
            <h3 class="font-bold mb-2">Reviews</h3>
            <div class="space-y-2 max-h-60 overflow-y-auto">
              ${allRatings.filter(r => r.review).map(r => `
                <div class="bg-base-200 rounded-lg p-3">
                  <div class="flex items-center gap-2 mb-1">
                    ${starsHtml(r.stars)}
                    <span class="text-xs opacity-60">User</span>
                  </div>
                  <p class="text-sm">${r.review}</p>
                </div>`).join('')}
            </div>` : ''}
        </div>
      </div>
    </div>`;
}

async function viewFavorites() {
  const favs = await DB.getAll('favorites');
  const books = await Promise.all(favs.map(f => DB.get('books', f.id)));
  const valid = books.filter(Boolean);
  document.getElementById('app').innerHTML = `
    <div class="fade-in">
      <h2 class="text-3xl font-bold mb-6 flex items-center gap-2"><i data-lucide="heart"></i> Favorites</h2>
      ${valid.length ? `
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
          ${valid.map(b => bookCard(b, trackUrl(b.id, b.cover))).join('')}
        </div>` : `
        <div class="text-center py-16 opacity-60">
          <i data-lucide="heart" class="w-16 h-16 mx-auto mb-3"></i>
          <p>No favorites yet. Tap the heart on any book to save it here.</p>
        </div>`}
    </div>`;
}

async function viewReading() {
  const items = await DB.getAll('reading');
  const books = await Promise.all(items.map(async i => ({ ...(await DB.get('books', i.id)), status: i.status })));
  const valid = books.filter(b => b && b.title);
  const groups = { 'to-read': [], reading: [], finished: [] };
  valid.forEach(b => groups[b.status].push(b));

  const section = (title, list, icon, empty) => `
    <div class="mb-8">
      <h3 class="text-xl font-bold mb-3 flex items-center gap-2">${icon} ${title} <span class="badge badge-sm">${list.length}</span></h3>
      ${list.length ? `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">${list.map(b => bookCard(b, trackUrl(b.id, b.cover))).join('')}</div>` : `<p class="opacity-60">${empty}</p>`}
    </div>`;

  document.getElementById('app').innerHTML = `
    <div class="fade-in">
      <h2 class="text-3xl font-bold mb-6 flex items-center gap-2"><i data-lucide="book-open"></i> Reading List</h2>
      ${section('To Read', groups['to-read'], '📌', 'Nothing queued up yet.')}
      ${section('Currently Reading', groups['reading'], '📖', 'Not reading anything right now.')}
      ${section('Finished', groups['finished'], '✅', 'No finished books yet.')}
    </div>`;
}

async function viewAdd() {
  document.getElementById('app').innerHTML = `
    <div class="fade-in">
      <h2 class="text-3xl font-bold mb-6">Add a Book</h2>
      <form class="card bg-base-100 shadow-xl max-w-2xl mx-auto" onsubmit="submitBook(event)">
        <div class="card-body">
          <label class="form-control">
            <span class="label-text mb-1">Cover Image</span>
            <input type="file" accept="image/*" id="bCover" class="file-input file-input-bordered" required>
          </label>
          <label class="form-control"><span class="label-text mb-1">Title</span>
            <input type="text" id="bTitle" class="input input-bordered" required></label>
          <label class="form-control"><span class="label-text mb-1">Author</span>
            <input type="text" id="bAuthor" class="input input-bordered" required></label>
          <label class="form-control"><span class="label-text mb-1">Genre</span>
            <select id="bGenre" class="select select-bordered" required>
              ${GENRES.map(g => `<option value="${g}">${g}</option>`).join('')}
            </select></label>
          <label class="form-control"><span class="label-text mb-1">Description</span>
            <textarea id="bDesc" class="textarea textarea-bordered" required></textarea></label>
          <button type="submit" class="btn btn-primary mt-2"><i data-lucide="plus"></i> Add Book</button>
        </div>
      </form>
    </div>`;
}

/* ============================================================
   Actions
   ============================================================ */
async function rateBook(id, stars) {
  await DB.put('ratings', { id, bookId: id, stars, review: (await DB.get('ratings', id))?.review || '' });
  toast(`Rated ${stars} stars`);
  await viewBook(id);
}

async function clearRating(id) {
  await DB.delete('ratings', id);
  toast('Rating cleared');
  await viewBook(id);
}

async function saveReview(id) {
  const review = document.getElementById('reviewInput').value.trim();
  const existing = await DB.get('ratings', id);
  if (!existing) { toast('Please rate the book first', 'warning'); return; }
  existing.review = review;
  await DB.put('ratings', existing);
  toast('Review saved');
  await viewBook(id);
}

async function toggleFav(id) {
  if (await isFavorite(id)) { await DB.delete('favorites', id); toast('Removed from favorites'); }
  else { await DB.put('favorites', { id }); toast('Added to favorites ❤️'); }
  await viewBook(id);
}

async function setReading(id, status) {
  if (status) await DB.put('reading', { id, status });
  else await DB.delete('reading', id);
  toast(status ? `Marked as ${status}` : 'Removed from reading list');
  await viewBook(id);
}

async function submitBook(e) {
  e.preventDefault();
  const file = document.getElementById('bCover').files[0];
  await DB.put('books', {
    id: 'b' + Date.now(),
    title: document.getElementById('bTitle').value,
    author: document.getElementById('bAuthor').value,
    genre: document.getElementById('bGenre').value,
    description: document.getElementById('bDesc').value,
    cover: file
  });
  toast('Book added! 📚');
  location.hash = '#/browse';
}

/* ============================================================
   UI helpers
   ============================================================ */
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `alert alert-${type} shadow-lg`;
  el.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}"></i><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  lucide.createIcons();
  setTimeout(() => el.remove(), 2200);
}

async function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  await DB.put('settings', { id: 'theme', value: next });
}

/* ============================================================
   Init
   ============================================================ */
(async () => {
  await openDB();
  const t = await DB.get('settings', 'theme');
  if (t) {
    document.documentElement.setAttribute('data-theme', t.value);
    document.getElementById('themeToggle').checked = t.value === 'dark';
  }
  document.getElementById('themeToggle').addEventListener('change', toggleTheme);
  await seedIfEmpty();
  await render();
})();
</script>
</body>
